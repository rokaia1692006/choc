<div class="shell">
  <aside>
    <h1>Choc admin</h1>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="on">Dashboard</a>
      <a routerLink="/products" routerLinkActive="on">Products</a>
      <a routerLink="/categories" routerLinkActive="on">Categories</a>
      <a routerLink="/orders" routerLinkActive="on">Orders</a>
      <a routerLink="/customers" routerLinkActive="on">Customers</a>
      <a routerLink="/settings" routerLinkActive="on">Settings</a>

    <div class="who">

      <button class="btn" (click)="logout()">Log out</button>

  </aside>
  <main><router-outlet /></main>
</div>
