<header class="top"><h2>Customers</h2>
  <input class="input" type="search" placeholder="Search name, phone or city" (input)="q.set($any($event.target).value)" aria-label="Search customers"></header>
@if (error()) { <p class="err" role="alert">{{ error() }}</p> }
<table class="tbl">
  <thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Orders</th><th>Joined</th></tr></thead>
  <tbody>
    @for (c of shown(); track c.id) {
      <tr><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.city }}</td><td>{{ c.ordersCount ?? 0 }}</td><td>{{ c.createdAt | date: 'd MMM y' }}</td></tr>
    } @empty { <tr><td colspan="5">No customers match.</td></tr> }
  </tbody>
</table>
