<h2>Categories</h2>
@if (error()) { <p class="err" role="alert">{{ error() }}</p> }
<form class="card row" [formGroup]="form" (ngSubmit)="save()">
  <label class="f">Name (English)<input class="input" formControlName="name"></label>
  <label class="f">Name (Arabic)<input class="input" dir="rtl" formControlName="nameAr"></label>
  <label class="f">Order<input class="input" type="number" formControlName="sortOrder"></label>
  <label class="chk"><input type="checkbox" formControlName="isActive"> Visible</label>
  <div class="acts">
    <button class="btn btn-primary" [disabled]="form.invalid">{{ editing() ? 'Save category' : 'Add category' }}</button>
    @if (editing()) { <button class="btn" type="button" (click)="reset()">Cancel</button> }
  </div>
</form>
<table class="tbl">
  <thead><tr><th>Name</th><th>Arabic</th><th>Order</th><th>Visible</th><th></th></tr></thead>
  <tbody>
    @for (c of items(); track c.id) {
      <tr><td>{{ c.name }}</td><td dir="rtl">{{ c.nameAr }}</td><td>{{ c.sortOrder }}</td><td>{{ c.isActive ? 'Yes' : 'No' }}</td>
        <td class="act"><button class="btn" (click)="edit(c)">Edit</button> <button class="btn btn-danger" (click)="remove(c)">Delete</button></td></tr>
    } @empty { <tr><td colspan="5">No categories yet. Add one above.</td></tr> }
  </tbody>
</table>
