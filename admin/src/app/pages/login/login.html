<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Choc admin</h1>
    <label class="f">Email<input class="input" type="email" formControlName="email" autocomplete="username"></label>
    <label class="f">Password<input class="input" type="password" formControlName="password" autocomplete="current-password"></label>
    @if (error()) { <p class="err" role="alert">{{ error() }}</p> }
    <button class="btn btn-primary" [disabled]="busy() || form.invalid">Log in</button>
  </form>
</main>
