<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Change your password</h1>
    <p>Choose a strong password. You must change it at least once every 30 days.</p>

    <label class="f">Current password
      <input class="input" type="password" formControlName="currentPassword" autocomplete="current-password">
    </label>
    <label class="f">New password
      <input class="input" type="password" formControlName="newPassword" autocomplete="new-password">
    </label>
    <label class="f">Confirm new password
      <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password">
    </label>

    @if (error()) { <p class="err" role="alert">{{ error() }}</p> }
    <button class="btn btn-primary" [disabled]="form.invalid || busy()">Change password</button>
  </form>
</main>
