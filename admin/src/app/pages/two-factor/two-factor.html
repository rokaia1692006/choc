<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    @if (isSetup()) {
      <h1>Set up your authenticator app</h1>
      <p>Open your authenticator app, choose to add an account, and scan this code.</p>
      @if (qr()) { <img class="qr" [src]="qr()" alt="QR code for your authenticator app" width="220" height="220"> }
      @else { <p>Preparing code</p> }
      <label class="f">Then enter the 6-digit code it shows
        <input class="input" formControlName="code" inputmode="numeric" autocomplete="one-time-code">
      </label>
      <button class="btn btn-primary" [disabled]="form.invalid || busy()">Turn on</button>
    } @else {
      <h1>Two-factor verification</h1>
      <p>Enter the 6-digit code from your authenticator app.</p>
      <label class="f">Authentication code
        <input class="input" formControlName="code" inputmode="numeric" autocomplete="one-time-code">
      </label>
      <button class="btn btn-primary" [disabled]="form.invalid || busy()">Verify</button>
    }
    @if (error()) { <p class="err" role="alert">{{ error() }}</p> }
  </form>
</main>
